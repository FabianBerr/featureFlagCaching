_schema-version: 3.3.0
ID: minimalsample
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: minimalsample-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires: []

  - name: minimalsample-mtx
    type: nodejs
    path: gen/mtx/sidecar
    build-parameters:
      builder: npm-ci
    parameters:
      instances: 1
      memory: 256M
      disk-quota: 512M
    hooks:
      - name: upgrade-all
        type: task
        phases:
          - blue-green.application.before-start.idle
          - deploy.application.before-start
        parameters:
          name: upgrade
          memory: 512M # increase as required
          disk-quota: 768M # increase as required
          command: cds-mtx upgrade '*'
    provides:
      - name: mtx-api
        properties:
          mtx-url: ${default-url}
    requires:
      - name: app-api
        properties:
          SUBSCRIPTION_URL: ~{app-protocol}://\${tenant_subdomain}-~{app-uri}

  - name: minimalsample-app-deployer
    type: com.sap.application.content
    path: app
    requires:
      - name: minimalsample-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - browse.zip
          name: browse
          target-path: resources/

  - name: browse
    type: html5
    path: app/browse
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build:cf
      supported-platforms: []
  - name: minimalsample
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    properties:
      TENANT_HOST_PATTERN: "^(.*)-${default-uri}"
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: mtx-api
        group: destinations
        properties:
          name: mtx-api # must be used in xs-app.json as well
          url: ~{mtx-url}
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

  - name: minimalsample-destination-content
    type: com.sap.application.content
    requires:
      - name: minimalsample-auth
        parameters:
          service-key:
            name: minimalsample-auth-key
      - name: minimalsample-html5-repo-host
        parameters:
          service-key:
            name: minimalsample-html5-repo-host-key
      - name: srv-api
      - name: minimalsample-destination
        parameters:
          content-target: true
    parameters:
      content:
        instance:
          destinations:
            - Name: minimalsample-html5-repo-host
              ServiceInstanceName: minimalsample-html5-repo-host
              ServiceKeyName: minimalsample-html5-repo-host-key
              sap.cloud.service: bookshopmtx
            - Authentication: OAuth2UserTokenExchange
              Name: minimalsample-auth
              ServiceInstanceName: minimalsample-auth
              ServiceKeyName: minimalsample-auth-key
              sap.cloud.service: bookshopmtx
          existing_destinations_policy: update
    build-parameters:
      no-source: true

resources:
  - name: minimalsample-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: minimalsample-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-name: kronesdigitalmes-destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        version: 1.0.0
    requires:
      - name: srv-api
  - name: minimalsample-registry
    type: org.cloudfoundry.managed-service
    requires:
      - name: mtx-api
    parameters:
      service: saas-registry
      service-plan: application
      config:
        xsappname: minimalsample-${org}-${space}
        appName: minimalsample-${org}-${space}
        displayName: minimalsample
        description: A simple CAP project.
        category: "Category"
        appUrls:
          getDependencies: ~{mtx-api/mtx-url}/-/cds/saas-provisioning/dependencies
          onSubscription: ~{mtx-api/mtx-url}/-/cds/saas-provisioning/tenant/{tenantId}
          onSubscriptionAsync: true
          onUnSubscriptionAsync: true
          onUpdateDependenciesAsync: true
          callbackTimeoutMillis: 300000 # Increase if your deployments are taking longer than that
